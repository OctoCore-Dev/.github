<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="320">
  <defs>
    <!-- Mica Canvas Gradient -->
    <linearGradient id="micaBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#242424" />
      <stop offset="50%" stop-color="#1f1f1f" />
      <stop offset="100%" stop-color="#181818" />
    </linearGradient>

    <!-- Card Elevation Background -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2c2c2c" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#262626" stop-opacity="0.85" />
    </linearGradient>

    <!-- Windows Accent Blue/Cyan Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0078D4" />
      <stop offset="100%" stop-color="#60CDFF" />
    </linearGradient>

    <!-- Subtle Elevation Glow -->
    <filter id="accentGlow" x="-10%" y="-20%" width="120%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .win-text { font-family: "Segoe UI Variable Display", "Segoe UI Variable", "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, sans-serif; }
    .mono-text { font-family: "Cascadia Mono", "Cascadia Code", "Consolas", "Fira Code", monospace; }
  </style>

  <!-- Windows 11 Outer App Window Frame -->
  <rect x="1" y="1" width="998" height="318" rx="12" fill="url(#micaBg)" stroke="#383838" stroke-width="1.2" />

  <!-- Window Header / TitleBar -->
  <path d="M 1,13 C 1,6.37 6.37,1 13,1 L 987,1 C 993.63,1 999,6.37 999,13 L 999,42 L 1,42 Z" fill="#1b1b1b" />
  <line x1="1" y1="42" x2="999" y2="42" stroke="#2d2d2d" stroke-width="1" />

  <!-- Windows Fluent App Icon (4 Tiles) -->
  <g transform="translate(18, 14)">
    <rect x="0" y="0" width="6.5" height="6.5" rx="1" fill="#60CDFF" />
    <rect x="8" y="0" width="6.5" height="6.5" rx="1" fill="#0078D4" />
    <rect x="0" y="8" width="6.5" height="6.5" rx="1" fill="#0078D4" />
    <rect x="8" y="8" width="6.5" height="6.5" rx="1" fill="#60CDFF" />
  </g>

  <!-- TitleBar Text -->
  <text class="win-text" x="42" y="25" fill="#D6D6D6" font-size="12" font-weight="500">OctoCore Technologies — Enterprise Systems &amp; Cloud Infrastructure (v10.0)</text>

  <!-- Windows 11 Window Caption Controls (Min, Max, Close) -->
  <g transform="translate(900, 10)">
    <!-- Minimize -->
    <rect x="0" y="0" width="28" height="22" rx="4" fill="transparent" />
    <line x1="9" y1="12" x2="19" y2="12" stroke="#8A8A8A" stroke-width="1.2" />
    <!-- Maximize -->
    <rect x="32" y="0" width="28" height="22" rx="4" fill="transparent" />
    <rect x="41" y="6" width="10" height="10" rx="1.5" fill="none" stroke="#8A8A8A" stroke-width="1.2" />
    <!-- Close -->
    <rect x="64" y="0" width="28" height="22" rx="4" fill="transparent" />
    <line x1="73" y1="6" x2="83" y2="16" stroke="#8A8A8A" stroke-width="1.2" />
    <line x1="83" y1="6" x2="73" y2="16" stroke="#8A8A8A" stroke-width="1.2" />
  </g>

  <!-- Subtle Mica Ambient Light Effect -->
  <circle cx="160" cy="120" r="140" fill="#0078D4" opacity="0.08" filter="url(#accentGlow)" />
  <circle cx="850" cy="220" r="120" fill="#60CDFF" opacity="0.05" filter="url(#accentGlow)" />

  <!-- Main Content Layout -->
  <!-- Left Side: Brand & Mission -->
  <g transform="translate(36, 68)">
    <!-- Active Indicator Pill -->
    <rect x="0" y="6" width="4" height="26" rx="2" fill="#60CDFF" />

    <text class="win-text" x="14" y="26" fill="#FFFFFF" font-size="28" font-weight="700" letter-spacing="1">OCTOCORE TECHNOLOGIES</text>
    
    <text class="win-text" x="14" y="52" fill="#60CDFF" font-size="14" font-weight="600" letter-spacing="0.5">High-Performance Distributed Systems &amp; Store-as-Code Engine</text>
    <text class="win-text" x="14" y="74" fill="#A4A4A4" font-size="13" font-weight="400">Engineering enterprise digital sovereignty, low-level L3 network drivers, and automated multi-store continuous deployment.</text>

    <!-- Fluent Pills / Feature Badges -->
    <g transform="translate(14, 94)">
      <!-- Pill 1: .NET 10 -->
      <rect x="0" y="0" width="124" height="28" rx="6" fill="#292929" stroke="#3D3D3D" stroke-width="1" />
      <circle cx="12" cy="14" r="4" fill="#60CDFF" />
      <text class="win-text" x="24" y="18" fill="#EAEAEA" font-size="11.5" font-weight="600">.NET 10 / C# 14</text>

      <!-- Pill 2: WinUI 3 -->
      <rect x="134" y="0" width="138" height="28" rx="6" fill="#292929" stroke="#3D3D3D" stroke-width="1" />
      <circle cx="146" cy="14" r="4" fill="#0078D4" />
      <text class="win-text" x="158" y="18" fill="#EAEAEA" font-size="11.5" font-weight="600">WinUI 3 &amp; XAML</text>

      <!-- Pill 3: Wintun L3 -->
      <rect x="282" y="0" width="130" height="28" rx="6" fill="#292929" stroke="#3D3D3D" stroke-width="1" />
      <circle cx="294" cy="14" r="4" fill="#60CDFF" />
      <text class="win-text" x="306" y="18" fill="#EAEAEA" font-size="11.5" font-weight="600">Wintun L3 Core</text>

      <!-- Pill 4: Store-as-Code -->
      <rect x="422" y="0" width="154" height="28" rx="6" fill="#292929" stroke="#3D3D3D" stroke-width="1" />
      <circle cx="434" cy="14" r="4" fill="#00CC6A" />
      <text class="win-text" x="446" y="18" fill="#EAEAEA" font-size="11.5" font-weight="600">Store-as-Code CLI</text>
    </g>
  </g>

  <!-- Right Side: 2 Elevation Info Cards (Fluent 2 Card Style) -->
  <g transform="translate(640, 64)">
    <!-- Card 1: Official Distribution -->
    <rect x="0" y="0" width="324" height="106" rx="8" fill="url(#cardBg)" stroke="#383838" stroke-width="1" />
    <g transform="translate(16, 16)">
      <text class="win-text" x="0" y="12" fill="#60CDFF" font-size="11" font-weight="700" letter-spacing="1">DISTRIBUTION ECOSYSTEM</text>
      <text class="win-text" x="0" y="32" fill="#FFFFFF" font-size="13" font-weight="600">Certified Store Packages</text>
      
      <!-- Metrics row -->
      <g transform="translate(0, 44)">
        <rect x="0" y="0" width="140" height="24" rx="4" fill="#1f1f1f" stroke="#303030" stroke-width="1" />
        <text class="win-text" x="8" y="16" fill="#A8D8FF" font-size="11" font-weight="500">Microsoft Store: OK</text>

        <rect x="148" y="0" width="140" height="24" rx="4" fill="#1f1f1f" stroke="#303030" stroke-width="1" />
        <text class="win-text" x="156" y="16" fill="#A3E2A8" font-size="11" font-weight="500">Google Play: OK</text>
      </g>
      <text class="win-text" x="0" y="82" fill="#888888" font-size="10.5">MSIX Appx &amp; Android VPNService verified</text>
    </g>

    <!-- Card 2: NuGet & Infrastructure -->
    <rect x="0" y="118" width="324" height="106" rx="8" fill="url(#cardBg)" stroke="#383838" stroke-width="1" />
    <g transform="translate(16, 16)">
      <text class="win-text" x="0" y="12" fill="#60CDFF" font-size="11" font-weight="700" letter-spacing="1">ENGINEERING TELEMETRY</text>
      <text class="win-text" x="0" y="32" fill="#FFFFFF" font-size="13" font-weight="600">NuGet Gallery &amp; Server Core</text>
      
      <!-- Metrics row -->
      <g transform="translate(0, 44)">
        <rect x="0" y="0" width="140" height="24" rx="4" fill="#1f1f1f" stroke="#303030" stroke-width="1" />
        <text class="win-text" x="8" y="16" fill="#60CDFF" font-size="11" font-weight="600">NuGet: 660+ DLs</text>

        <rect x="148" y="0" width="140" height="24" rx="4" fill="#1f1f1f" stroke="#303030" stroke-width="1" />
        <text class="win-text" x="156" y="16" fill="#D4D4D4" font-size="11" font-weight="500">No-Logs: 100% RAM</text>
      </g>
      <text class="win-text" x="0" y="82" fill="#888888" font-size="10.5">Dual-Ray Hedging &amp; Zero-Allocation Span&lt;T&gt;</text>
    </g>
  </g>

  <!-- Bottom Fluent Status Bar (32px) -->
  <g transform="translate(0, 288)">
    <rect x="1" y="0" width="998" height="31" fill="#191919" stroke="#2D2D2D" stroke-width="1" />
    <circle cx="20" cy="15" r="4" fill="#00CC6A" />
    <text class="win-text" x="32" y="19" fill="#999999" font-size="11">Production Nodes: Healthy</text>
    <text class="win-text" x="220" y="19" fill="#777777" font-size="11">|</text>
    <text class="win-text" x="240" y="19" fill="#999999" font-size="11">Domain: obxodka.one</text>
    <text class="win-text" x="390" y="19" fill="#777777" font-size="11">|</text>
    <text class="win-text" x="410" y="19" fill="#999999" font-size="11">Registry: nuget.octopublisher.octocore.dev</text>
    <text class="win-text" x="840" y="19" fill="#60CDFF" font-size="11" font-weight="600">Microsoft Fluent 2 Spec</text>
  </g>
</svg>